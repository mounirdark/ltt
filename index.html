#splash{

}

button{

    padding:18px;

    border-radius:18px;

    font-size:18px;
    font-weight:600;

    background:#ff4d6d;
    color:white;

    box-shadow:0 10px 20px rgba(255,77,109,.25);

    transition:all .15s ease;
}

button:active{
    transform:scale(.97);
}

.fade{
    opacity:0;
    transform:translateY(20px);
}

.stats{
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{

    backdrop-filter:blur(10px);
    border-radius:16px;
    padding:12px;
    font-size:14px;

let scores = {
    spark:0,
    flow:0,
    depth:0,
    raw:0,
    mirror:0
};

let usedQuestions = [];

function updateScores(){

    document.getElementById("sparkScore").innerText = scores.spark;
    document.getElementById("flowScore").innerText = scores.flow;
    document.getElementById("depthScore").innerText = scores.depth;
    document.getElementById("rawScore").innerText = scores.raw;
    document.getElementById("mirrorScore").innerText = scores.mirror;

}

function nextQuestion(){

    const card = document.getElementById("question");

    const lowestCategory =
        Object.keys(scores).reduce((a,b)=>
            scores[a] < scores[b] ? a : b
        );

    let pool = questions.filter(q =>
        q.category === lowestCategory &&
        !usedQuestions.includes(q.text)
    );

    if(pool.length === 0){

        usedQuestions = [];

        pool = questions.filter(q =>
            q.category === lowestCategory
        );
    }

    const randomIndex = Math.floor(Math.random() * pool.length);

    const question = pool[randomIndex];

    usedQuestions.push(question.text);

    scores[question.category]++;

    updateScores();

    card.classList.add("fade");

    setTimeout(()=>{

        card.innerText = question.text;

        card.classList.remove("fade");

    },200);
}

setTimeout(()=>{

    document.getElementById("splash").style.display = "none";

    nextQuestion();

},1800);
